{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Sematec{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'startup/i/favicon.png' %}" type="image/png">
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,600,700|Nunito:300,400,600,700&subset=latin" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="{% static 'startup/css/style.css' %}">
</head>
<body>

<nav class="bg-light pt-30 pb-30">
    <div class="container px-xl-0 d-flex justify-content-between align-items-center">
        <a href="{% url 'home' %}" class="logo link color-heading">Sematec</a>
        <div class="d-flex align-items-center">
            <a href="{% url 'home' %}" class="link color-heading f-18 medium mx-15">Home</a>
            <a href="{% url 'sematec:course_list' %}" class="link color-heading f-18 medium mx-15">Courses</a>

            {% if user.is_staff %}
                <a href="{% url 'sematec:course_create' %}" class="ml-15 btn sm action-1">Add course</a>
            {% endif %}

            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="link color-heading f-18 medium mx-15">Dashboard</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline ml-15">
                    {% csrf_token %}
                    <button type="submit" class="btn sm action-1">Logout ({{ user.username }})</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="link color-heading f-18 medium mx-15">Login</a>
                <a href="{% url 'register' %}" class="ml-15 btn sm action-1">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="pt-60 pb-60">
    <div class="container px-xl-0">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="bg-light pt-40 pb-40 text-center">
    <div class="container px-xl-0">
        <div class="f-14">&copy; Sematec. Template by <a href="https://bootstrap.build/" target="_blank">Bootstrap.Build</a></div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({easing: 'ease-out-cubic', offset: 50, once: true});
</script>
</body>
</html>
