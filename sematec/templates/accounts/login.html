{% extends 'base_auth.html' %}

{% block title %}Login{% endblock %}

{% block form %}
    <h3 class="font-weight-bolder text-gradient text-primary">Welcome back</h3>
    <p class="mb-4">Enter your username and password to sign in.</p>

    {% if form.errors %}
        <div class="alert alert-danger text-white py-2" role="alert">Invalid username or password.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" value="{{ form.username.value|default:'' }}" required autofocus>
        </div>
        <label>Password</label>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn bg-gradient-primary w-100 mt-4 mb-0">Sign in</button>
    </form>

    <p class="mt-4 text-sm text-center">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-primary text-gradient font-weight-bold">Sign up</a>
    </p>
{% endblock %}
